version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: emma-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emma}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - emma_db_data:/var/lib/postgresql/data
    #ports:
    #  - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emma-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_DATABASE: ${POSTGRES_DB:-emma}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      PORT: 3001
    depends_on:
      - db
    #ports:
    #  - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emma-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3001/api/v1}
      PORT: 3000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2
    container_name: emma-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  emma_db_data:
  caddy_data:
  caddy_config:
